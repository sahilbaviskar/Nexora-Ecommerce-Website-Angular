@if (!product) {
  <!-- Skeleton loader -->
  <div class="animate-pulse">
    <div class="rounded-xl sm:rounded-2xl md:rounded-3xl aspect-square md:aspect-auto md:h-80 bg-gray-200 large-mobile"></div>
    <div class="mt-3 space-y-2">
      <div class="h-4 bg-gray-200 rounded w-3/4"></div>
      <div class="h-3 bg-gray-200 rounded w-1/4"></div>
    </div>
  </div>
} @else {
<a [routerLink]="['/product', product.slug]" class="group block cursor-pointer">

  <div 
  class="card-image relative overflow-hidden
  rounded-xl sm:rounded-2xl md:rounded-3xl
  aspect-square md:aspect-auto md:h-80
  large-mobile">

    <!-- wishlist heart -->
    <button
      (click)="toggleWishlist($event)"
      class="absolute top-3 right-3 z-10 bg-white/90 backdrop-blur-sm rounded-full p-2 shadow-md hover:scale-110 transition cursor-pointer"
      aria-label="Toggle wishlist"
    >
      @if (wishlistService.isInWishlist(product.id)) {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
          <path fill="red" d="M11.98 19.094q-.291 0-.577-.106q-.286-.105-.503-.323L9.752 17.63q-2.67-2.425-4.71-4.717Q3 10.622 3 8.15q0-1.908 1.296-3.204T7.5 3.65q1.094 0 2.279.553T12 6.289q1.037-1.533 2.221-2.086T16.5 3.65q1.908 0 3.204 1.296T21 8.15q0 2.529-2.125 4.862t-4.652 4.622l-1.142 1.031q-.218.218-.513.323t-.587.106"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
          <path fill="currentColor" d="M11.98 19.094q-.291 0-.577-.106q-.286-.105-.503-.323L9.752 17.63q-2.67-2.425-4.71-4.717Q3 10.622 3 8.15q0-1.908 1.296-3.204T7.5 3.65q1.094 0 2.279.553T12 6.289q1.037-1.533 2.221-2.086T16.5 3.65q1.908 0 3.204 1.296T21 8.15q0 2.529-2.125 4.862t-4.652 4.622l-1.142 1.031q-.218.218-.513.323t-.587.106m-.47-11.767q-.898-1.448-1.867-2.063Q8.675 4.65 7.5 4.65q-1.5 0-2.5 1t-1 2.5q0 1.108.627 2.272q.627 1.165 1.684 2.386q1.056 1.22 2.429 2.498q1.371 1.277 2.856 2.629q.173.154.404.154t.404-.154q1.485-1.352 2.857-2.63q1.372-1.276 2.429-2.497q1.056-1.222 1.683-2.386T20 8.15q0-1.5-1-2.5t-2.5-1q-1.175 0-2.144.615q-.97.614-1.867 2.062q-.08.135-.214.202T12 7.596t-.275-.067t-.213-.202M12 11.398"/>
        </svg>
      }
    </button>

    <img
      [src]="product.image"
      class="w-full h-full object-cover"
    />

    <!-- out-of-stock overlay -->
    @if (product.stock === 0) {
      <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
        <span class="bg-white text-gray-800 text-xs font-bold px-3 py-1 rounded-full">Out of Stock</span>
      </div>
    }

    <!-- low stock badge -->
    @if (product.stock !== undefined && product.stock > 0 && product.stock <= 3) {
      <span class="absolute bottom-3 left-3 bg-orange-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full">
        Only {{ product.stock }} left
      </span>
    }

  </div>

  <div class="mt-3">
    <h3 class="font-medium">{{product.title}}</h3>
    <p class="text-gray-500 text-sm">₹{{product.price}}</p>
  </div>

</a>
}
