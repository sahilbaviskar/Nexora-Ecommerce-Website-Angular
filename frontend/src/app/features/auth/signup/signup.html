<section class="mt-4 px-6 lg:px-10 h-[calc(100dvh-80px)] flex items-center">

  <!-- main container -->
  <div class="bg-gray-100 rounded-3xl overflow-hidden w-full h-full">

    <div class="flex flex-col lg:flex-row h-full">

      <!-- LEFT IMAGE -->
      <div class="hidden lg:block lg:w-1/2 h-full overflow-hidden relative">
        
        <img 
          src="/signUp-In/signUpBG.webp" 
          alt="girl_img" 
          class="w-full h-full object-cover object-[center_top]" 
        />

        <!-- overlay -->
        <div class="absolute inset-0 bg-linear-to-t from-black/40 to-transparent"></div>

        <!-- text -->
        <div class="absolute bottom-6 left-6 text-white">
          <h3 class="text-xl font-semibold font-inter">
            Elevating the art of curation.
          </h3>
          <p class="text-sm opacity-80 max-w-xs">
            Join our community of intentional collectors and editorial enthusiasts.
          </p>
        </div>

      </div>

      <!-- RIGHT FORM -->
      <div class="w-full lg:w-1/2 h-full flex items-center justify-center p-6 md:p-8 lg:p-10">

        <div class="w-full max-w-md">

          <!-- heading -->
          <h2 class="text-2xl md:text-3xl lg:text-4xl font-semibold font-inter">
            Create Account
          </h2>

          <p class="mt-2 text-gray-500 text-sm md:text-base">
            Experience fashion through a curated lens.
          </p>

          <!-- error toast -->
          @if (error) {
            <div class="fixed top-6 right-6 z-50 bg-red-500 text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 animate-slide-in">
              <span class="text-sm font-medium">{{ error }}</span>
              <button (click)="error = ''" class="text-white/80 hover:text-white text-lg leading-none">&times;</button>
            </div>
          }

          <!-- form -->
          <form (ngSubmit)="onSubmit()" class="mt-4 flex flex-col gap-3">

            <!-- name -->
            <div>
              <label for="signup-name" class="text-xs font-medium text-gray-500 tracking-wider">
                FULL NAME
              </label>
              <input
                type="text"
                id="signup-name"
                placeholder="John Doe"
                name="name"
                [(ngModel)]="name"
                class="mt-2 w-full px-5 py-2.5 rounded-full bg-gray-200 outline-none"
                required
              />
            </div>

            <!-- email -->
            <div>
              <label for="signup-email" class="text-xs font-medium text-gray-500 tracking-wider">
                EMAIL ADDRESS
              </label>
              <input
                type="email"
                id="signup-email"
                placeholder="hello@example.com"
                name="email"
                [(ngModel)]="email"
                class="mt-2 w-full px-5 py-2.5 rounded-full bg-gray-200 outline-none"
                required
              />
            </div>

            <!-- passwords -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

              <div>
                <label for="signup-password" class="text-xs font-medium text-gray-500 tracking-wider">
                  PASSWORD
                </label>
                <input
                  type="password"
                  id="signup-password"
                  placeholder="••••••••"
                  name="password"
                  [(ngModel)]="password"
                  class="mt-2 w-full px-5 py-2.5 rounded-full bg-gray-200 outline-none"
                  required
                />
              </div>

              <div>
                <label for="signup-confirm-password" class="text-xs font-medium text-gray-500 tracking-wider">
                  CONFIRM PASSWORD
                </label>
                <input
                  type="password"
                  id="signup-confirm-password"
                  placeholder="••••••••"
                  name="confirmPassword"
                  [(ngModel)]="confirmPassword"
                  class="mt-2 w-full px-5 py-2.5 rounded-full bg-gray-200 outline-none"
                  required
                />
              </div>

            </div>

            <!-- terms -->
            <label class="flex items-center gap-2 text-sm text-gray-500">
              <input type="checkbox" class="accent-black" />
              I agree to the 
              <span class="underline cursor-pointer">Terms & Conditions</span>
            </label>

            <!-- button -->
            <button
              type="submit"
              class="mt-2 bg-black text-white rounded-full py-2.5 font-medium hover:opacity-80 transition"
            >
              Sign Up
            </button>

          </form>

          <!-- divider -->
          <div class="flex items-center gap-3 my-4">
            <div class="flex-1 h-px bg-gray-300"></div>
            <span class="text-xs text-gray-400">OR</span>
            <div class="flex-1 h-px bg-gray-300"></div>
          </div>

          <!-- google -->
          <button class="w-full border rounded-full py-2.5 flex items-center justify-center gap-3">
            <svg
                class="h-5 w-5"
                xmlns="http://www.w3.org/2000/svg"
                x="0px"
                y="0px"
                width="100"
                height="100"
                viewBox="0 0 48 48"
              >
                <path
                  fill="#FFC107"
                  d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"
                ></path>
                <path
                  fill="#FF3D00"
                  d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"
                ></path>
                <path
                  fill="#4CAF50"
                  d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"
                ></path>
                <path
                  fill="#1976D2"
                  d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"
                ></path>
              </svg>
          
            Continue with Google
          </button>

          <!-- login -->
          <p class="text-center mt-3 text-sm text-gray-500">
            Already have an account?
            <a routerLink="/login" class="text-black font-medium">Sign In</a>
          </p>

        </div>

      </div>

    </div>

  </div>

</section>
