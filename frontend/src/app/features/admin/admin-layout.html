<div class="flex h-screen bg-gray-100 font-sans overflow-hidden">

  <!-- Mobile backdrop -->
  @if (sidebarOpen) {
    <div class="fixed inset-0 bg-black/50 z-20 md:hidden" (click)="sidebarOpen = false"></div>
  }

  <!-- Sidebar -->
  <aside [class]="'fixed inset-y-0 left-0 z-30 w-64 bg-gray-900 text-white flex flex-col transition-transform duration-300 ease-in-out md:relative md:shrink-0 ' + (sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0')">

    <!-- Sidebar header -->
    <div class="px-6 py-5 border-b border-gray-700 flex items-center justify-between shrink-0">
      <div class="min-w-0">
        <span class="text-xl font-bold tracking-tight">Admin Panel</span>
        <p class="text-xs text-gray-400 mt-0.5 truncate">{{ adminName }}</p>
      </div>
      <button (click)="sidebarOpen = false" class="md:hidden text-gray-400 hover:text-white p-1 shrink-0 ml-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Nav links -->
    <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">
      <a routerLink="/admin/dashboard" routerLinkActive="bg-gray-700 text-white"
         (click)="sidebarOpen = false"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition text-sm">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Dashboard
      </a>
      <a routerLink="/admin/products" routerLinkActive="bg-gray-700 text-white"
         (click)="sidebarOpen = false"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition text-sm">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10"/>
        </svg>
        Products
      </a>
      <a routerLink="/admin/orders" routerLinkActive="bg-gray-700 text-white"
         (click)="sidebarOpen = false"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition text-sm">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        Orders
      </a>
      <a routerLink="/admin/users" routerLinkActive="bg-gray-700 text-white"
         (click)="sidebarOpen = false"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition text-sm">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0"/>
        </svg>
        Users
      </a>
    </nav>

    <!-- Sidebar footer -->
    <div class="px-4 py-4 border-t border-gray-700 shrink-0">
      <a routerLink="/" (click)="sidebarOpen = false"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700 transition text-sm mb-1">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Back to Store
      </a>
      <button (click)="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-red-400 hover:bg-gray-700 transition text-sm">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main content area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <!-- Mobile top bar -->
    <header class="md:hidden flex items-center gap-3 bg-gray-900 text-white px-4 py-3 shrink-0 shadow-lg">
      <button (click)="sidebarOpen = true" class="text-gray-300 hover:text-white p-0.5">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-bold text-sm tracking-tight">Admin Panel</span>
    </header>

    <!-- Page content -->
    <div class="flex-1 overflow-auto">
      <router-outlet />
    </div>
  </div>

</div>
