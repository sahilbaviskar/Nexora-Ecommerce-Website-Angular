<div class="min-h-screen bg-gray-950 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <!-- Logo / Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-white rounded-2xl shadow mb-4">
        <svg class="w-7 h-7 text-gray-900" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Admin Access</h1>
      <p class="text-sm text-gray-400 mt-1">Sign in with your admin account</p>
    </div>

    <!-- Card -->
    <div class="bg-gray-900 rounded-2xl border border-gray-800 p-8">
      @if (error) {
        <div class="bg-red-900/40 border border-red-700 text-red-300 text-sm px-4 py-3 rounded-lg mb-5">
          {{ error }}
        </div>
      }

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Email</label>
          <input [(ngModel)]="email" type="email" placeholder="admin@example.com"
                 (keyup.enter)="login()"
                 class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-white/30 focus:border-gray-500 transition"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Password</label>
          <input [(ngModel)]="password" type="password" placeholder="••••••••"
                 (keyup.enter)="login()"
                 class="w-full bg-gray-800 border border-gray-700 text-white placeholder-gray-500 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-white/30 focus:border-gray-500 transition"/>
        </div>
      </div>

      <button (click)="login()" [disabled]="loading"
              class="mt-6 w-full bg-white text-gray-900 font-semibold text-sm py-2.5 rounded-lg hover:bg-gray-100 transition disabled:opacity-50 disabled:cursor-not-allowed">
        {{ loading ? 'Signing in…' : 'Sign In' }}
      </button>
    </div>

    <div class="text-center mt-5">
      <a routerLink="/" class="text-sm text-gray-500 hover:text-gray-300 transition">
        ← Back to store
      </a>
    </div>
  </div>
</div>
