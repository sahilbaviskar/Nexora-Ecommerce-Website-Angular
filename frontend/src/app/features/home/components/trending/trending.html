<section class="mt-10 px-6 lg:px-10">

  <!-- header -->
  <div class="flex items-center justify-between flex-wrap gap-4">
    <h2 class="text-2xl md:text-3xl font-semibold">Trending</h2>

    <div class="flex gap-2 overflow-x-auto scrollbar-hidden">
      @for (cat of categories; track cat) {
        <button
          (click)="filterByCategory(cat)"
          [class]="'px-4 py-1.5 rounded-full text-sm whitespace-nowrap cursor-pointer ' + (activeCategory() === cat ? 'bg-black text-white' : 'border')"
        >
          {{ cat | titlecase }}
        </button>
      }
    </div>
  </div>


  <!-- DESKTOP -->
  <div class="hidden md:grid grid-cols-12 gap-4 mt-6">

    <div class="col-span-3">
      <app-product-card [product]="products()[0]"></app-product-card>
    </div>

    <div class="col-span-3">
      <app-product-card [product]="products()[1]"></app-product-card>
    </div>

    <div class="col-span-6">
      <app-product-card [product]="products()[2]"></app-product-card>
    </div>

    <div class="col-span-6">
      <app-product-card [product]="products()[3]"></app-product-card>
    </div>

    <div class="col-span-3">
      <app-product-card [product]="products()[4]"></app-product-card>
    </div>

    <div class="col-span-3">
      <app-product-card [product]="products()[5]"></app-product-card>
    </div>

  </div>


  <!-- MOBILE -->
  <div class="grid grid-cols-2 gap-4 mt-6 md:hidden">

    <!-- row 1 -->
    <app-product-card [product]="products()[0]"></app-product-card>
    <app-product-card [product]="products()[1]"></app-product-card>

    <!-- row 2 -->
    <div class="col-span-2">
  <app-product-card [product]="products()[2]" class="large-card"></app-product-card>
</div>

    <!-- row 3 -->
    <app-product-card [product]="products()[3]"></app-product-card>
    <app-product-card [product]="products()[4]"></app-product-card>

    <!-- row 4 -->
    <div class="col-span-2">
  <app-product-card [product]="products()[5]" class="large-card "></app-product-card>
</div>

  </div>

</section>
