<section class="mt-16 px-6 lg:px-10">
  <div class="flex flex-col lg:flex-row lg:items-center gap-6">
    <!-- left -->
    <div class="lg:w-[28%]">
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-semibold leading-tight">
        Explore <br />
        by Colors
      </h2>
    </div>

    <!-- right -->
    <div
      class="lg:w-[72%] flex flex-wrap gap-3 lg:gap-5 max-lg:w-full xl:max-w-175 2xl:max-w-175"
    >
      @for (color of colors; track color.value) {
        <button
          (click)="selectColor(color.value)"
          [class]="'flex items-center gap-2 px-4 py-2 lg:px-5 lg:py-2.5 rounded-full border text-xs md:text-sm font-medium whitespace-nowrap cursor-pointer transition ' + (activeColor() === color.value ? 'bg-black text-white border-black' : 'hover:border-gray-400')"
        >
          <span [class]="'w-3 h-3 lg:w-4 lg:h-4 rounded-full ' + color.bg"></span>
          {{ color.name }}
        </button>
      }
    </div>
  </div>

  <!-- Product Cards -->
  @if (filteredProducts().length) {
    <div #scrollContainer class="mt-8 overflow-x-auto scrollbar-hidden snap-x snap-mandatory" (scroll)="updateScales()" [attr.data-init]="onScrollInit(scrollContainer)">
      <div class="flex items-center pb-6" style="min-width: max-content; gap: 0;">
        @for (product of tripleProducts; track $index) {
          <div class="color-card flex-shrink-0 snap-center" style="width: 280px; padding: 0 8px;">
            <div class="color-card-inner transition-all duration-300 ease-out origin-center">
              <app-product-card [product]="product"></app-product-card>
            </div>
          </div>
        }
      </div>
    </div>
  } @else {
    <div class="mt-8 text-center py-12 text-gray-400 text-sm">
      No products found in this color.
    </div>
  }
</section>
